---
layout: default
---

<div class="lang-selector">
  <div class="lang-logo-wrap">
    <img class="lang-logo" src="{{ '/assets/img/lauji_fr_inverted_with_path.svg
' | relative_url }}" alt="lauji.fr" />
  </div>

  <!-- <h1>{{ page.title | default: "🌐" }}</h1>   -->
  <h1 class="lang-title" style="--flag: url('{{ '/assets/img/flags/globe.svg' | relative_url }}');">
    <img class="lang-flag" src="{{ '/assets/img/flags/globe.svg' | relative_url }}" alt="Language" />

  </h1>

  <div class="lang-grid">
    
    <!-- <a class="lang-card" style="--flag: url('{{ '/assets/img/flags/en.svg' | relative_url }}');" href="{{ '/en/' | relative_url }}"> -->
    <a class="lang-card" href="{{ '/en/' | relative_url }}">
    <!-- <div class="lang-code">en</div> -->
    <div class="lang-name">English</div>
    </a>
    
    <!-- <a class="lang-card" style="--flag: url('{{ '/assets/img/flags/fr.svg' | relative_url }}');" href="{{ '/fr/' | relative_url }}"> -->
    <a class="lang-card" href="{{ '/fr/' | relative_url }}">
    <!-- <div class="lang-code">fr</div> -->
    <div class="lang-name">Français</div>
    </a>

    <!-- <a class="lang-card" style="--flag: url('{{ '/assets/img/flags/gcf.svg' | relative_url }}');" href="{{ '/gcf/' | relative_url }}"> -->
    <a class="lang-card" href="{{ '/gcf/' | relative_url }}">
    <!-- <div class="lang-code">gcf</div> -->
    <div class="lang-name">Kréyòl Matinik</div>
    </a>

    <a class="lang-card" href="{{ '/zh-CN/' | relative_url }}">
    <div class="lang-name">简体中文</div>
    </a>

    <a class="lang-card" href="{{ '/zh-TW/' | relative_url }}">
    <div class="lang-name">繁體中文</div>
    </a>

  </div>
</div>

<script>
  (function() {
    const urlParams = new URLSearchParams(window.location.search);
    const noRedirect = urlParams.has('noredirect');

    // Always attach the click handler, even when noredirect is present.
    document.querySelectorAll('.lang-card').forEach(card => {
      card.addEventListener('click', function () {
        const path = new URL(this.href, window.location.origin).pathname;
        const slug = path.split('/').filter(Boolean).pop();
        if (slug) {
          localStorage.setItem('preferred-locale', slug);
        }
      });
    });

    // Manual override: show the selector without auto-redirecting.
    if (noRedirect) {
      return;
    }

    // Redirect immediately if a preference is already saved.
    const supportedLocales = ['en', 'fr', 'gcf', 'zh-CN', 'zh-TW'];
    const preferredLocale = localStorage.getItem('preferred-locale');
    if (preferredLocale) {
      // Migrate the legacy "zh" preference to the explicit "zh-CN" code.
      const locale = preferredLocale === 'zh' ? 'zh-CN' : preferredLocale;
      if (supportedLocales.includes(locale)) {
        window.location.href = "{{ '/' | relative_url }}" + locale + "/";
      } else {
        // Drop stale preferences such as the removed "es" or "de" locales.
        localStorage.removeItem('preferred-locale');
      }
    }
  })();
</script>
