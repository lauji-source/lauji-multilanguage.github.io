<script>
  (function() {
    const urlParams = new URLSearchParams(window.location.search);
    
    // If the user explicitly wants to change language, clear the preference and don't redirect
    if (urlParams.has('noredirect')) {
      localStorage.removeItem('preferred-locale');
      return;
    }

    // Redirect immediately if a preference is already saved
    const preferredLocale = localStorage.getItem('preferred-locale');
    if (preferredLocale) {
      window.location.href = "{{ '/' | relative_url }}" + preferredLocale + "/";
      return;
    }

    // Save preference when a language card is clicked
    document.querySelectorAll('.lang-card').forEach(card => {
      card.addEventListener('click', function(e) {
        const href = this.getAttribute('href');
        const match = href.match(/\/([a-z]{2,3})\/$/);
        if (match && match[1]) {
          localStorage.setItem('preferred-locale', match[1]);
        }
      });
    });
  })();
</script>
