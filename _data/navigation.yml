# Shared navigation structure. This file is language-independent.
# Labels are looked up in _data/sitetext/<lang>.yml under nav.<key>.
# section values are the stable anchor IDs used by every language.

nav:
  - key: services
    section: servicesSection
  - key: about
    section: aboutSection
  - key: timeline
    section: timelineSection
  - key: contact
    section: contactSection
  - key: language
    url: "/?noredirect=true"
