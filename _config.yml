# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
# This file is *NOT* reloaded automatically when you use 'bundle exec jekyll serve'.
# If you change this file, please restart the server process.

# Site settings
# are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

theme: jekyll-agency

url    : https://lauji.fr # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # the subpath of your site, e.g. /blog

title      : lauji.fr
email      : contact@lauji.fr #this is also the email contact forms will go to
description: "Drone inspection and technical services"
author     : lauji.fr
logo:     #optional, defaults to site title
  path: assets/img/lauji_fr_inverted_with_path.svg
  height: 60 #height in px, defaults to 52px

logo_zh_CN:
  path: assets/img/lauji_fr_CN_inverted_with_path.svg
  height: 60 #height in px, defaults to 52px

logo_zh_TW:
  path: assets/img/lauji_fr_TW_inverted_with_path.svg
  height: 60 #height in px, defaults to 52px

locale: en # See available languages in _data/sitetext/

analytics:
  google: #Google Analytics tracking code here

collections:
portfolio:

exclude : ["README.md", "Gemfile", "Gemfile.lock", "oldWebsite/", "index.html"]

markdown: kramdown

sass:
  quiet_deps: true

under_construction: true

include: [".htaccess"]
# Uncomment following line to use Formspree form ID based URL instead of email based URL
# Details: https://help.formspree.io/hc/en-us/articles/360017735154-How-to-prevent-spam
# formspree_form_path: "f/a_form_id"